name: Build & Push Docker Images

on:
  push:
    branches: ["main"]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: jess-xu123/rio-cinema-backend
  FRONTEND_IMAGE: jess-xu123/rio-cinema-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Restart Rahti Deployments
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.RAHTI_TOKEN }}" \
            -H "Content-Type: application/strategic-merge-patch+json" \
            -d "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"kubectl.kubernetes.io/restartedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}}}}" \
            "https://api.2.rahti.csc.fi:6443/apis/apps/v1/namespaces/group-h-rio-cinme-app/deployments/rio-cinema-frontend"

          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.RAHTI_TOKEN }}" \
            -H "Content-Type: application/strategic-merge-patch+json" \
            -d "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"kubectl.kubernetes.io/restartedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}}}}" \
            "https://api.2.rahti.csc.fi:6443/apis/apps/v1/namespaces/group-h-rio-cinme-app/deployments/group-h-cinema-system-git"
